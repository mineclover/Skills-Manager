[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"
reqwest = { version = "0.11", features = ["json", "blocking", "stream", "multipart"] }
tokio = { version = "1", features = ["sync", "macros", "rt"] }
semver = "1.0"
rayon = "1.11.0"
zip = "0.6.6"
toml = "0.8"
futures-util = "0.3"
regex = "1.10"
once_cell = "1.19"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
mockito = "1.4.0"
tempfile = "3.10"
