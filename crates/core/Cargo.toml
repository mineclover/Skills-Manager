semver = { workspace = true }
rayon = { workspace = true }
zip = { workspace = true }
toml = { workspace = true }
futures-util = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
mockito = { workspace = true }
